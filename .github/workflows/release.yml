name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency (tag ↔ tauri.conf.json ↔ package.json ↔ Cargo.toml)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.+-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected vX.Y.Z[-pre])"
            exit 1
          fi
          EXPECTED="${TAG#v}"
          TAURI_VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          PKG_VER=$(jq -r '.version' package.json)
          CARGO_VER=$(awk -F\" '/^version[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)
          echo "tag(stripped)=$EXPECTED  tauri=$TAURI_VER  package=$PKG_VER  cargo=$CARGO_VER"
          fail=0
          for pair in "src-tauri/tauri.conf.json:$TAURI_VER" "package.json:$PKG_VER" "src-tauri/Cargo.toml:$CARGO_VER"; do
            name="${pair%%:*}"
            val="${pair#*:}"
            if [[ "$val" != "$EXPECTED" ]]; then
              echo "::error file=$name::version mismatch — $name has '$val', expected '$EXPECTED' (from tag $TAG)"
              fail=1
            fi
          done
          [[ "$fail" -eq 0 ]] || exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (universal binary)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
