name: CommandCenter regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: npm audit gate tests
        run: bash scripts/npm-audit-gate.test.sh
      - name: npm audit gate (production high/critical blocks; listed build-tool advisories warn, see #18)
        run: bash scripts/npm-audit-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          if-no-files-found: ignore
      - run: npm test
      - run: npm run build
      - run: cargo test --locked
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
